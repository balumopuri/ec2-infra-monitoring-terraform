name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Required for GitHub OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MCS-LAB/INFRA_MONITORING/environments/dev

    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================================
      # 3. Configure AWS Credentials using GitHub OIDC
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::610489687511:role/SwiftChange-dev-github-actions-role
          aws-region: us-east-1


      # ==========================================================
      # 4. Verify AWS Identity
      # ==========================================================

      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # ==========================================================
      # 5. Terraform Format Check
      # ==========================================================

      - name: Terraform Format
        run: terraform fmt -check -recursive


      # ==========================================================
      # 6. Terraform Init
      # ==========================================================

      - name: Terraform Init
        run: terraform init


      # ==========================================================
      # 7. Terraform Validate
      # ==========================================================

      - name: Terraform Validate
        run: terraform validate


      # ==========================================================
      # 8. Terraform Plan
      # ==========================================================

      - name: Terraform Plan
        run: terraform plan